<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <script> 
        let city="Phnom Penh";
        console.log(city);
        const PI=3.14;
        // PI=3.14159; 
        console.log(PI);
        let score=10;
        score=20;
        console.log(score);
    </script>
    //Answer
    <h3>ភាពខុសគ្នារវាង let និង constគឺ៖​ <br>
    let អាចផ្លាស់ប្ដូរ​តម្លៃ​បាន ខណៈដែល const មិនអាចផ្លាស់ប្ដូរ​តម្លៃ​បាន<br>
    សាកល្បងដាក់ឈ្មោះ variable ទាំងនេះ ហើយកត់ថាមួយណាត្រឹមត្រូវ មួយណាខុស៖ myName, 2name, my-name, _age, $price, let
    myName->true<br>
    2name->false<br>
    _age->true<br>
    my-name->true<br>
    $price->true<br>
    let->false
    </h3>
</body>
